        var highlightLayer;
        function highlightFeature(e) {
            highlightLayer = e.target;

        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    var img = popup._contentNode.querySelector('td img');
                    if (img) {
                        // If already loaded (cache), update immediately
                        if (img.complete && img.naturalHeight > 0) {
                            popup.update();
                        } else {
                            img.addEventListener('load', function() {
                                popup.update();
                            });
                            img.addEventListener('error', function() {
                                popup.update();
                            });
                        }
                    }
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }
        var zoomControl = L.control.zoom({
            position: 'topleft'
        }).addTo(map);
        var measureControl = new L.Control.Measure({
            position: 'topleft',
            primaryLengthUnit: 'meters',
            secondaryLengthUnit: 'kilometers',
            primaryAreaUnit: 'sqmeters',
            secondaryAreaUnit: 'hectares'
        });
        measureControl.addTo(map);
        document.getElementsByClassName('leaflet-control-measure-toggle')[0].innerHTML = '';
        document.getElementsByClassName('leaflet-control-measure-toggle')[0].className += ' fas fa-ruler';
        var bounds_group = new L.featureGroup([]);
        var mobilePhotoSheet = document.getElementById('mobilePhotoSheet');
        var mobilePhotoImage = document.getElementById('mobilePhotoImage');
        var mobilePhotoName = document.getElementById('mobilePhotoName');
        var mobilePhotoDate = document.getElementById('mobilePhotoDate');
        var mobilePhotoCount = document.getElementById('mobilePhotoCount');
        var mobilePhotoNav = document.getElementById('mobilePhotoNav');
        var mobilePhotoPrev = document.getElementById('mobilePhotoPrev');
        var mobilePhotoNext = document.getElementById('mobilePhotoNext');
        var mobilePhotoClose = document.getElementById('mobilePhotoClose');
        var mobilePhotoFeatures = [];
        var mobilePhotoIndex = 0;
        function isMobileLayout() {
            return window.matchMedia('(max-width: 700px)').matches || window.matchMedia('(pointer: coarse)').matches;
        }
        function formatPhotoDate(rawDate) {
            if (!rawDate) return 'Data não informada';
            try {
                return new Intl.DateTimeFormat('pt-BR', {
                    day: '2-digit', month: '2-digit', year: 'numeric',
                    hour: '2-digit', minute: '2-digit'
                }).format(new Date(rawDate));
            } catch (error) {
                return String(rawDate);
            }
        }
        function photoPath(feature) {
            return 'images/' + String(feature.properties['photo']).replace(/[\\/:]/g, '_').trim();
        }
        function renderMobilePhoto() {
            var feature = mobilePhotoFeatures[mobilePhotoIndex];
            if (!feature) return;
            mobilePhotoImage.src = photoPath(feature);
            mobilePhotoImage.alt = 'Fotografia ' + String(feature.properties['filename'] || '');
            mobilePhotoName.textContent = 'Fotografia ' + String(feature.properties['filename'] || '');
            mobilePhotoDate.textContent = formatPhotoDate(feature.properties['timestamp']);
            mobilePhotoCount.textContent = mobilePhotoFeatures.length > 1
                ? 'Fotografia ' + (mobilePhotoIndex + 1) + ' de ' + mobilePhotoFeatures.length
                : '1 fotografia neste ponto';
            mobilePhotoNav.style.display = mobilePhotoFeatures.length > 1 ? 'flex' : 'none';
            mobilePhotoPrev.disabled = mobilePhotoIndex === 0;
            mobilePhotoNext.disabled = mobilePhotoIndex === mobilePhotoFeatures.length - 1;
        }
        function openMobileGallery(features, startIndex) {
            mobilePhotoFeatures = features.filter(Boolean);
            mobilePhotoIndex = Math.max(0, Math.min(startIndex || 0, mobilePhotoFeatures.length - 1));
            if (!mobilePhotoFeatures.length) return;
            renderMobilePhoto();
            mobilePhotoSheet.classList.add('is-open');
            mobilePhotoSheet.setAttribute('aria-hidden', 'false');
        }
        function openMobilePhoto(feature) {
            openMobileGallery([feature], 0);
        }
        function closeMobilePhoto() {
            mobilePhotoSheet.classList.remove('is-open');
            mobilePhotoSheet.setAttribute('aria-hidden', 'true');
            mobilePhotoImage.removeAttribute('src');
            mobilePhotoFeatures = [];
            mobilePhotoIndex = 0;
        }
        mobilePhotoPrev.addEventListener('click', function () {
            if (mobilePhotoIndex > 0) {
                mobilePhotoIndex -= 1;
                renderMobilePhoto();
            }
        });
        mobilePhotoNext.addEventListener('click', function () {
            if (mobilePhotoIndex < mobilePhotoFeatures.length - 1) {
                mobilePhotoIndex += 1;
                renderMobilePhoto();
            }
        });
        mobilePhotoClose.addEventListener('click', closeMobilePhoto);
        document.addEventListener('keydown', function (event) {
            if (event.key === 'Escape') closeMobilePhoto();
        });

        }

        function pop_fotos_georeferenciadas_2(feature, layer) {
            var rawDate = feature.properties['timestamp'];
            var formattedDate = formatPhotoDate(rawDate);
            var photoSrc = photoPath(feature).replace(/'/g, '\'').replace(/"/g, '&quot;');
            var popupContent = '<article class="photo-card">' +
                '<img src="' + photoSrc + '" alt="Fotografia ' + feature.properties['filename'] + '">' +
                '<div class="photo-card__body"><div><div class="photo-card__name">Fotografia ' + feature.properties['filename'] + '</div>' +
                '<div class="photo-card__date">' + formattedDate + '</div></div><span class="photo-card__badge">Registro de campo</span></div></article>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 700, maxWidth: 600, autoPanPadding: [24, 100] });
            layer.on('click', function () {
                if (isMobileLayout()) {
                    layer.closePopup();
                    openMobilePhoto(feature);
                }

        }

            attribution: '',

            dataVar: 'json_fotos_georeferenciadas_2',
